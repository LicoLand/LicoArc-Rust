name: Verify

on:
  push:
    branches: [main]
    tags: ["*-v[0-9]*"]
  pull_request:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Fetch the canonical authority bundle
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          curl -fsSL "https://raw.githubusercontent.com/LicoLand/LicoArc/e33b151a6d9870b73857f68d333f15010584cc2c/artifacts/v1/licoarc.bundle.json" -o "$RUNNER_TEMP/licoarc.bundle.json"
          actual="$(shasum -a 256 "$RUNNER_TEMP/licoarc.bundle.json" | cut -d' ' -f1)"
          test "$actual" = "e47aa234dee48ca3f791c733b2514c93f1e912bce8f5754813879c6b197d6814"
          echo "LICOARC_AUTHORITY_BUNDLE=$RUNNER_TEMP/licoarc.bundle.json" >> "$GITHUB_ENV"
      - name: Verify
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: ./tools/verify "$LICOARC_AUTHORITY_BUNDLE"
      - name: Package the tagged crate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          RUSTUP_TOOLCHAIN: 1.95.0
        run: cargo package --locked -p "${TAG%-v*}"
