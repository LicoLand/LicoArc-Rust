name: Verify

on:
  push:
    branches: [main]
    tags: ["*-v[0-9]*"]
  pull_request:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Fetch the canonical authority bundle
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          curl -fsSL "https://raw.githubusercontent.com/LicoLand/LicoArc/8489b611b14c0d4dd27e7d702f5c26aff82fba30/artifacts/v1/licoarc.bundle.json" -o "$RUNNER_TEMP/licoarc.bundle.json"
          actual="$(shasum -a 256 "$RUNNER_TEMP/licoarc.bundle.json" | cut -d' ' -f1)"
          test "$actual" = "df271d20fb4662ef6795cd1e7eea0d917a6e8426b50e773f41558a01dc5221d3"
          echo "LICOARC_AUTHORITY_BUNDLE=$RUNNER_TEMP/licoarc.bundle.json" >> "$GITHUB_ENV"
      - name: Verify
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: ./tools/verify "$LICOARC_AUTHORITY_BUNDLE"
      - name: Package the tagged crate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          RUSTUP_TOOLCHAIN: 1.95.0
        run: cargo package --locked -p "${TAG%-v*}"
