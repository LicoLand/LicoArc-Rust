name: Publish

# Runs the default-branch copy of this file after Verify succeeds for a pushed
# `<crate>-v<version>` tag, so a tagged commit can never supply the workflow
# that receives the crates.io trusted-publishing identity.
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]

permissions: {}

concurrency:
  group: publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_branch, '-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    # No step in this job executes repository-controlled code: the toolchain
    # is installed before checkout and pinned for every cargo call, cargo runs
    # outside the checkout with an empty CARGO_HOME so repository cargo
    # configuration is never read, and nothing is compiled under the token.
    steps:
      - name: Prepare an isolated publishing toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          mkdir -p "$RUNNER_TEMP/cargo-home" "$RUNNER_TEMP/publish"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the tag to reviewed default-branch source
        id: crate
        working-directory: ${{ runner.temp }}/publish
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUSTUP_TOOLCHAIN: 1.95.0
          CARGO_HOME: ${{ runner.temp }}/cargo-home
        run: |
          set -euo pipefail
          case "$TAG" in
            *[!A-Za-z0-9._-]*) echo "::error::unexpected tag name"; exit 1 ;;
          esac
          repo="$GITHUB_WORKSPACE"
          git -C "$repo" fetch --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG" "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          test "$(git -C "$repo" rev-parse "refs/tags/$TAG^{commit}")" = "$SHA"
          git -C "$repo" merge-base --is-ancestor "$SHA" "refs/remotes/origin/$DEFAULT_BRANCH"
          crate="${TAG%-v*}"
          version="${TAG##*-v}"
          actual="$(cargo metadata --no-deps --format-version 1 --manifest-path "$repo/Cargo.toml" | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')"
          if [ "$actual" != "$version" ]; then
            echo "::error::tag $TAG does not match workspace crate $crate ($actual)"
            exit 1
          fi
          echo "name=$crate" >> "$GITHUB_OUTPUT"
          # The first version of a crate is uploaded manually (crates.io needs
          # it before Trusted Publishing can be configured); its tag then only
          # records provenance. An already-published version is not re-sent,
          # but it must have been packaged from exactly this tagged commit.
          agent="LicoLand release workflow (github.com/LicoLand)"
          status="$(curl -sS -o /dev/null -w '%{http_code}' -A "$agent" "https://crates.io/api/v1/crates/$crate/$version")"
          case "$status" in
            200)
              curl -fsSL -A "$agent" "https://static.crates.io/crates/$crate/$crate-$version.crate" -o published.crate
              published_sha="$(tar -xOzf published.crate "$crate-$version/.cargo_vcs_info.json" | jq -r '.git.sha1')"
              if [ "$published_sha" != "$SHA" ]; then
                echo "::error::$crate $version on crates.io was packaged from $published_sha, not $SHA"
                exit 1
              fi
              echo "::notice::$crate $version is already on crates.io from $SHA"
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io lookup for $crate $version returned $status"; exit 1 ;;
          esac
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.crate.outputs.published == 'false'
        id: auth
      - name: Publish
        if: steps.crate.outputs.published == 'false'
        working-directory: ${{ runner.temp }}/publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CARGO_HOME: ${{ runner.temp }}/cargo-home
          RUSTUP_TOOLCHAIN: 1.95.0
          CRATE: ${{ steps.crate.outputs.name }}
        run: cargo publish --locked --no-verify --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" -p "$CRATE"
